name: Build & test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # If the repo has no android/ folder, create it so the APK can be built.
      - name: Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name cfop_trainer .
          fi

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests (including verification of every algorithm)
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: cube-trainer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
