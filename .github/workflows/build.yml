name: Build & test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name cfop_trainer .
          fi

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests (including verification of every algorithm)
        run: flutter test

      - name: Signing key (from GitHub secrets)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/app/upload-keystore.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
            "$GITHUB_WORKSPACE/android/app/upload-keystore.jks" > android/key.properties

      - name: Temporary signing key (no secrets set)
        if: env.KEYSTORE_BASE64 == ''
        run: |
          if [ ! -f android/key.properties ]; then
            keytool -genkeypair -keystore "$GITHUB_WORKSPACE/android/app/ci-temp.jks" -alias ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass cipass123 -keypass cipass123 -dname "CN=Cube Trainer CI"
            printf 'storePassword=cipass123\nkeyPassword=cipass123\nkeyAlias=ci\nstoreFile=%s\n' \
              "$GITHUB_WORKSPACE/android/app/ci-temp.jks" > android/key.properties
            echo "::warning::APK signed with a temporary key. Uninstall the old app before installing it."
          fi

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: cube-trainer-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Если в репозитории еще нет папки windows, создаем её
      - name: Windows project
        run: |
          if (!(Test-Path "windows")) {
            flutter create --platforms=windows --project-name cfop_trainer .
          }

      - name: Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: cube-trainer-windows-exe
          path: build/windows/x64/runner/release/
